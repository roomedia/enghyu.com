<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FEE500">
  <title>카톡 테마 변환기</title>
  <!-- Google tag (gtag.js). 페이지 조회는 이 정적 태그가 보낸다. app.js의 track()은
       사용자 동작에만 발화하므로 이게 없으면 조회 자체가 집계되지 않는다.
       측정 ID를 바꿀 때는 아래 KTHEME_GA_ID도 같이 바꾼다. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G5WKCES0DY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-G5WKCES0DY');
  </script>
  <!-- 애드센스 사이트 확인 스니펫. 크롤러가 <head>에서 이 태그를 찾으므로 정적으로 둔다.
       Ad Placement API도 같은 스크립트를 쓴다. adBreak·adConfig는 이 스크립트가 만들어 주지
       않고 페이지가 정의해야 한다. const로 선언하면 window에 안 붙어서 명시로 대입한다.
       pub 번호를 바꿀 때는 아래 KTHEME_ADSENSE_CLIENT도 같이 바꾼다. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8418699849772106"
     crossorigin="anonymous" data-ad-frequency-hint="30s"></script>
  <script>
    window.adsbygoogle = window.adsbygoogle || [];
    window.adBreak = window.adConfig = options => window.adsbygoogle.push(options);
  </script>
  <style>
    :root {
      color-scheme: light;
      --page: #f1f3ef;
      --page-deep: #e7ebe5;
      --surface: #fbfcfa;
      --surface-soft: #e9ede8;
      --ink: #202622;
      --muted: #667068;
      --line: #d5ddd5;
      --accent: #FEE500;
      --accent-ink: #191919;
      --phone: #1d211f;
      --phone-edge: #343a36;
      --shadow: 0 24px 60px rgb(32 38 34 / 0.14);
      font: 16px/1.5 Arial, "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--page); }
    body { min-width: 320px; min-height: 100dvh; margin: 0; color: var(--ink); background: var(--page); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.62; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .shell { width: min(1240px, calc(100% - 40px)); margin: 0 auto; }
    .site-header { display: flex; align-items: center; justify-content: space-between; min-height: 76px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; color: var(--accent-ink); background: var(--accent); font-size: 12px; font-weight: 900; }
    .header-note { color: var(--muted); font-size: 13px; }

    main { padding: 16px 0 16px; }
    .hero { display: grid; grid-template-columns: minmax(0, 0.86fr) minmax(420px, 1.14fr); gap: clamp(42px, 8vw, 116px); align-items: center; min-height: 690px; }
    .hero-copy { max-width: 510px; }
    .eyebrow { margin: 0 0 18px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
    .converter { display: grid; gap: 12px; margin-top: 0; }
    .converter-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .file-picker, .convert-button { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 14px; font-size: 14px; font-weight: 800; transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease; }
    .file-picker { color: var(--ink); background: transparent; }
    .file-picker:hover { background: var(--surface-soft); }
    .file-picker input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; clip-path: inset(50%); }
    .convert-button { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); }
    .convert-button:disabled { border-color: var(--line); color: var(--muted); background: var(--surface-soft); opacity: 1; }
    .file-picker:active, .convert-button:active { transform: translateY(1px) scale(0.98); }
    .form-hint { margin: 0; color: var(--muted); font-size: 12px; }
    .snackbar { position: fixed; bottom: 24px; left: 50%; z-index: 30; max-width: min(560px, calc(100% - 32px)); padding: 13px 18px; border-radius: 12px; color: var(--surface); background: var(--ink); box-shadow: 0 12px 32px rgb(32 38 34 / 0.24); font-size: 13px; line-height: 1.45; opacity: 0; pointer-events: none; visibility: hidden; transform: translate(-50%, 12px); transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease; }
    .snackbar.is-visible { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

    .site-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; padding: 18px 0 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10pt; }
    .site-footer a { color: var(--muted); text-underline-offset: 3px; }

    .preview-stage { position: relative; display: grid; justify-items: center; min-height: 690px; padding: 30px 0 18px; }
    .preview-stage::before { content: ""; position: absolute; top: 7%; right: 2%; width: 72%; height: 78%; border-radius: 46% 54% 50% 50%; background: var(--page-deep); transform: rotate(-8deg); z-index: -1; }
    .phone { width: min(100%, 382px); height: 679px; min-height: 0; padding: 13px; border: 7px solid var(--phone-edge); border-radius: 42px; background: var(--phone); box-shadow: var(--shadow); }
    .phone-inner { position: relative; height: 639px; min-height: 0; overflow: hidden; border-radius: 31px; background: var(--preview-bg, #fff); }
    .phone-speaker { position: absolute; top: 8px; left: 50%; z-index: 2; width: 76px; height: 6px; border-radius: 999px; background: var(--phone); transform: translateX(-50%); }
    .device { display: flex; height: 639px; min-height: 0; flex-direction: column; overflow: hidden; }
    .empty-preview { display: grid; place-items: center; min-height: 598px; padding: 36px; color: var(--muted); text-align: center; }

    .preview-card { position: relative; z-index: 1; }
    .chat-header, .screen-header { display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 10px; min-height: 66px; padding: 22px 17px 12px; border-bottom: 1px solid rgb(0 0 0 / 0.08); color: var(--preview-ink, #202124); background: var(--preview-bg, #fff); }
    .chat-header span, .screen-header span { min-width: 0; overflow: hidden; font-size: 15px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .chat { display: flex; min-height: 0; flex: 1 1 auto; flex-direction: column; gap: 9px; overflow-y: auto; padding: 18px 12px 10px; scrollbar-color: var(--line) transparent; scrollbar-width: thin; color: var(--preview-ink, #202124); }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--line); }
    .chat-meta { align-self: center; margin: 0 0 2px; color: var(--preview-muted, #69707d); font-size: 11px; }
    .notice { align-self: center; padding: 5px 9px; border-radius: 999px; color: var(--preview-muted, #69707d); background: rgb(0 0 0 / 0.07); font-size: 11px; }
    .bubble { position: relative; display: flex; flex: 0 0 auto; min-height: 44px; align-items: center; }
    .bubble.me { align-self: flex-end; }
    .bubble.you { align-self: flex-start; }
    .bubble canvas { display: block; width: 100%; height: 100%; }
    .bubble-text { position: absolute; z-index: 1; font: 15px/1.5 Arial, "Apple SD Gothic Neo", sans-serif; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; pointer-events: none; }
    .input-bar { display: flex; flex: 0 0 auto; align-items: center; gap: 7px; padding: 9px 10px; border-top: 1px solid rgb(0 0 0 / 0.08); color: var(--preview-muted, #69707d); background: color-mix(in srgb, var(--preview-bg, #fff) 92%, #000 8%); }
    .input-bar input { min-width: 0; flex: 1; padding: 10px 11px; border: 1px solid rgb(0 0 0 / 0.12); border-radius: 12px; outline: none; color: var(--preview-ink, #202124); background: var(--preview-bg, #fff); font-size: 13px; }
    .input-bar input::placeholder { color: var(--preview-muted, #69707d); opacity: 1; }
    .input-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
    .input-bar button { flex: 0 0 auto; min-width: 54px; padding: 10px 11px; border: 0; border-radius: 12px; color: var(--accent-ink); background: var(--accent); font-size: 12px; font-weight: 800; }
    .input-bar button:active { transform: scale(0.96); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .tab-bar { display: flex; flex: 0 0 auto; justify-content: space-around; padding: 10px 8px 9px; border-top: 1px solid rgb(0 0 0 / 0.08); color: var(--preview-muted, #69707d); background: var(--preview-bg, #fff); font-size: 11px; }
    .tab-bar .tab { display: inline-flex; min-width: 64px; flex-direction: column; align-items: center; gap: 3px; padding: 2px 6px; border: 0; border-radius: 10px; color: inherit; background: none; font-size: 11px; }
    .tab-bar .tab.is-active { font-weight: 800; }
    .tab-bar .tab:hover { background: rgb(0 0 0 / 0.05); }
    .tab-icon { width: 22px; height: 22px; object-fit: contain; }

    .mode-toggle { display: inline-grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; padding: 0; border: 0; border-radius: 9px; color: inherit; background: none; }
    .mode-toggle:hover { background: rgb(0 0 0 / 0.09); }
    .mode-icon { width: 16px; height: 16px; fill: currentColor; }

    .device.is-dark .chat-header, .device.is-dark .screen-header, .device.is-dark .input-bar, .device.is-dark .tab-bar { color: #e8eaed; background: #1b1d1f; }
    .device.is-dark .input-bar input { border-color: rgb(255 255 255 / 0.16); color: #e8eaed; background: #2a2d30; }
    .device.is-dark .input-bar input::placeholder { color: #9aa0a6; }
    .device.is-dark .tab-bar .tab { color: #9aa0a6; }
    .device.is-dark .tab-bar .tab.is-active { color: #e8eaed; }
    .device.is-dark .mode-toggle:hover, .device.is-dark .tab-bar .tab:hover { background: rgb(255 255 255 / 0.12); }

    .screen-body { display: flex; min-height: 0; flex: 1 1 auto; flex-direction: column; overflow-y: auto; padding: 10px 0 6px; scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
    .screen-body::-webkit-scrollbar { width: 6px; }
    .screen-body::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--line); }
    .section-title { flex: 0 0 auto; padding: 8px 16px 7px; border-bottom: 1px solid; font-size: 11px; font-weight: 800; }
    .list-row { display: flex; flex: 0 0 auto; align-items: center; gap: 11px; width: 100%; padding: 11px 16px; border: 0; border-bottom: 1px solid; background: none; text-align: left; }
    .list-link { cursor: pointer; }
    .list-link:hover { background: rgb(0 0 0 / 0.05); }
    .avatar { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 14px; object-fit: cover; }
    .avatar-empty { background: rgb(0 0 0 / 0.12); }
    .list-text { display: grid; min-width: 0; gap: 2px; }
    .list-text strong { font-size: 14px; font-weight: 700; }
    .list-text small { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .more-grid { display: grid; flex: 0 0 auto; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 16px 14px; }
    .more-cell { display: grid; min-height: 58px; place-items: center; border-radius: 14px; background: rgb(0 0 0 / 0.06); }

    .passcode { align-items: center; justify-content: center; gap: 18px; padding: 16px; }
    .passcode-back { position: absolute; top: 14px; left: 12px; padding: 6px 9px; border: 0; border-radius: 9px; background: none; font-size: 12px; font-weight: 700; }
    .passcode-back:hover { background: rgb(0 0 0 / 0.08); }
    .passcode-title { flex: 0 0 auto; font-size: 15px; font-weight: 700; }
    .bullets { display: flex; flex: 0 0 auto; gap: 16px; }
    .bullet { width: 22px; height: 22px; object-fit: contain; }
    .bullet-empty { border: 2px solid; border-radius: 999px; }
    .keypad { display: grid; flex: 0 0 auto; grid-template-columns: repeat(3, 66px); gap: 6px; padding: 12px; border-radius: 18px; }
    .keypad-key { display: grid; min-height: 46px; place-items: center; font-size: 19px; font-weight: 600; }


    @media (max-width: 820px) {
      .shell { width: min(100% - 28px, 620px); }
      .site-header { min-height: 66px; }
      .hero { grid-template-columns: 1fr; gap: 40px; min-height: 0; padding-top: 0; }
      .hero-copy { max-width: none; }
      h1 { max-width: 580px; font-size: clamp(46px, 13vw, 72px); }
      .lede { max-width: 520px; }
      .preview-stage { min-height: 0; padding-top: 40px; }
      .preview-stage::before { right: 8%; width: 86%; height: 82%; }
    }

    @media (max-width: 480px) {
      .shell { width: min(100% - 24px, 420px); }
      main { padding-top: 0; }
      .header-note { display: none; }
      .converter-actions { align-items: stretch; }
      .file-picker, .convert-button { flex: 1 1 100%; }
      .phone { width: min(100%, 360px); transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      .phone { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="카톡 테마 변환기 홈">
        <span class="brand-mark" aria-hidden="true">카톡</span>
        <span>카톡 테마 변환기</span>
      </a>
    </header>

    <main>
      <section class="hero" aria-label="카톡 테마 변환기">
        <div class="hero-copy">
          <form id="theme-form" class="converter">
            <div class="converter-actions">
              <label class="file-picker" for="theme-file">
                <span>파일 선택</span>
                <input id="theme-file" type="file" accept=".ktheme,.zip,.apk" required>
              </label>
              <button class="convert-button" type="submit" disabled>다운로드</button>
            </div>
          </form>
        </div>

        <div class="preview-stage" aria-label="채팅 프리뷰">
          <div class="phone" aria-label="메신저 프리뷰">
            <div class="phone-inner">
              <span class="phone-speaker" aria-hidden="true"></span>
              <section id="preview-device" class="device">
                <div class="empty-preview">테마 파일을 선택하면<br>채팅 화면이 열립니다.</div>
              </section>
            </div>
          </div>
          <p id="preview-metrics" class="sr-only" aria-live="polite">프리뷰 준비 중</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a href="/">enghyu</a>
      <a href="privacy">개인정보 처리 방침</a>
    </footer>
  </div>
  <div id="snackbar" class="snackbar" role="status" aria-live="polite" aria-hidden="true"></div>
  <script>
    // 배포 환경에서만 채운다. 비어 있으면 광고와 GA는 아무 요청도 보내지 않는다.
    // 애드센스 심사 통과 전까지는 비워 둔다. 광고가 안 붙는 상태에서 게이트를 켜면
    // adBreak 콜백이 아무것도 안 와서 45초 타임아웃까지 다운로드가 멈춘다.
    // 심사가 끝나면 "ca-pub-8418699849772106"을 넣는다. 먼저 head 태그에
    // data-adbreak-test="on"을 붙여 목 광고로 게이트 전 구간을 확인하고 지운다.
    window.KTHEME_ADSENSE_CLIENT = "";
    window.KTHEME_GA_ID = "G-G5WKCES0DY";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="static/app.js"></script>
</body>
</html>
