<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 — AX 트렌드</title>
<meta name="description" content="AX 트렌드 글의 조회수·유입 경로·내부 이동 통계.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --text: #1a1a1a; --muted: #666;
    --border: #e5e5e5; --card: #fafafa; --accent: #0b6efd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --text: #e8e8e8; --muted: #9a9a9a;
      --border: #2a2d33; --card: #17191e; --accent: #5b9dff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px 80px; }
  .topnav { margin-bottom: 20px; }
  .topnav a { color: var(--muted); font-size: 14px; text-decoration: none; }
  .topnav a:hover { color: var(--accent); text-decoration: underline; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
  p.lead { margin: 0 0 8px; color: var(--muted); }
  .total { font-size: 20px; margin: 16px 0 32px; }
  .total strong { font-size: 32px; color: var(--accent); }
  .days { margin-bottom: 24px; }
  .days button { margin-right: 8px; padding: 6px 14px; border: 1px solid var(--border);
                 border-radius: 999px; background: var(--bg); color: var(--text);
                 font-size: 14px; cursor: pointer; }
  .days button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  h2 { font-size: 20px; margin: 36px 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.path { word-break: break-all; }
  td.path a { color: var(--text); text-decoration: none; }
  td.path a:hover { color: var(--accent); text-decoration: underline; }
  .empty { color: var(--muted); padding: 16px 0; }
  .note { color: var(--muted); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
  <div class="wrap">
    <nav class="topnav"><a href="/ax/">&larr; AX 트렌드 목록</a></nav>
    <h1>통계</h1>
    <p class="lead">조회수·유입 경로·글 간 이동. 쿠키 없이 집계한다.</p>
    <div class="days">
      <button data-days="7">7일</button>
      <button data-days="30" class="active">30일</button>
      <button data-days="90">90일</button>
    </div>
    <div class="total">총 조회수 <strong id="total">–</strong></div>

    <h2>많이 본 글</h2>
    <div id="paths"><p class="empty">불러오는 중…</p></div>

    <h2>유입 경로</h2>
    <div id="refs"><p class="empty">불러오는 중…</p></div>

    <h2>글 간 이동</h2>
    <div id="flows"><p class="empty">불러오는 중…</p></div>

    <p class="note">집계는 일자별로 R2에 저장되며, 동시 접속이 겹치면 몇 건이 빠질 수 있다.</p>
  </div>
<script>
(function(){
  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

  function table(rows, pathLink){
    if (!rows.length) return '<p class="empty">아직 데이터가 없다.</p>';
    var h = '<table><tbody>';
    rows.forEach(function(r){
      var label = esc(r[0]);
      if (pathLink && /^\/ax\//.test(r[0])) label = '<a href="'+esc(r[0])+'">'+label+'</a>';
      h += '<tr><td class="path">'+label+'</td><td class="n">'+r[1].toLocaleString()+'</td></tr>';
    });
    return h + '</tbody></table>';
  }

  function load(days){
    document.getElementById('total').textContent = '–';
    fetch('/ax/api/stats?days='+days).then(function(res){ return res.json(); }).then(function(d){
      document.getElementById('total').textContent = (d.totalViews||0).toLocaleString();
      document.getElementById('paths').innerHTML = table(d.topPaths||[], true);
      document.getElementById('refs').innerHTML = table(d.topRefs||[], false);
      document.getElementById('flows').innerHTML = table(d.topFlows||[], false);
    }).catch(function(){
      document.getElementById('paths').innerHTML = '<p class="empty">불러오기 실패</p>';
    });
  }

  var btns = document.querySelectorAll('.days button');
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      btns.forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      load(b.getAttribute('data-days'));
    });
  });
  load(30);

  // 이 페이지 자체도 집계
  try {
    var data = JSON.stringify({p: location.pathname, r: document.referrer || ""});
    if (navigator.sendBeacon) { navigator.sendBeacon("/ax/api/track", data); }
    else { fetch("/ax/api/track", {method: "POST", body: data, keepalive: true}); }
  } catch (e) {}
})();
</script>
</body>
</html>
