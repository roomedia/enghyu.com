name = "ktheme-converter"
main = "worker.js"
compatibility_date = "2026-08-16"

# 정적 자산과 API를 한 배포로 낸다. app.js가 프로덕션에서 /shared-cache 를
# 상대경로로 부르므로 worker와 같은 origin이어야 한다.
# public/ 은 npm run build 가 만든다. 레포 루트를 그대로 올리지 않는다.
# routes 를 넣으면 workers.dev 가 기본으로 꺼진다. 옛 공유 링크의 301 을 이 Worker 가
# 내보내야 하므로 명시로 켜 둔다. 링크가 다 정리되면 false 로 내려도 된다.
workers_dev = true

# 허브는 apex, 변환기는 그 아래 `/ktheme/`. 프로젝트가 늘면 형제 경로에
# route 로 각자 Worker 를 붙인다 — route 가 custom domain 보다 먼저 실행된다.
[[routes]]
pattern = "enghyu.com"
custom_domain = true

[assets]
directory = "./public"
# Worker 를 자산보다 앞에 세운다. 옛 workers.dev 링크의 301 이 `/` 같은 자산 경로에서도
# 발화해야 하기 때문이다. 대신 worker.js 가 남은 경로를 ASSETS 로 직접 내보낸다.
run_worker_first = true
# Worker 가 PUT 검증에서 base.apk 를 되읽는다. 클라이언트 캐시 키가 base 바이트를
# 섞어 만들기 때문에 그 바이트가 없으면 key 와 본문의 관계를 확인할 수 없다.
binding = "ASSETS"

[[r2_buckets]]
binding = "KTHEME_CACHE"
bucket_name = "ktheme-cache"
